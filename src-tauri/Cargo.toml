[package]
name = "histories-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "histories_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
histories-core = { path = "../crates/histories-core" }
