[workspace]
members = ["crates/histories-core", "crates/histories-cli", "src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Sebastian Kouba"]

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
fs2 = "0.4"
rusqlite = { version = "0.40", features = ["bundled", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.20", features = ["v4", "serde"] }
walkdir = "2.5"

# wayland-scanner 0.31.10 on crates.io pins vulnerable quick-xml 0.39.
# Upstream has applied the 0.41 upgrade but has not published a new release yet.
[patch.crates-io]
wayland-scanner = { git = "https://github.com/Smithay/wayland-rs.git", rev = "a55c54b4e138e29181d63908ece06fd2a13550a0" }
